groups:
- name: lms-application
  rules:
  # Application Health
  - alert: LMSApplicationDown
    expr: up{job="lms-app"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "LMS Application is down"
      description: "LMS application has been down for more than 1 minute."

  - alert: LMSHighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected"
      description: "Error rate is {{ $value }} errors per second."

  - alert: LMSHighResponseTime
    expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High response time"
      description: "95th percentile response time is {{ $value }} seconds."

  - alert: LMSLowThroughput
    expr: rate(http_requests_total[5m]) < 0.1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Low request throughput"
      description: "Request rate is {{ $value }} requests per second."

- name: lms-database
  rules:
  # Database Health
  - alert: DatabaseDown
    expr: up{job="postgres"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Database is down"
      description: "PostgreSQL database has been down for more than 1 minute."

  - alert: DatabaseHighConnections
    expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High database connections"
      description: "Database connections are at {{ $value }}% of maximum."

  - alert: DatabaseSlowQueries
    expr: rate(pg_stat_database_tup_returned[5m]) / rate(pg_stat_database_tup_fetched[5m]) < 0.1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Slow database queries"
      description: "Database query efficiency is low."

  - alert: DatabaseDiskSpace
    expr: (pg_database_size_bytes / 1024 / 1024 / 1024) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Database disk space high"
      description: "Database size is {{ $value }} GB."

- name: lms-cache
  rules:
  # Redis Health
  - alert: RedisDown
    expr: up{job="redis"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Redis is down"
      description: "Redis cache has been down for more than 1 minute."

  - alert: RedisHighMemoryUsage
    expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Redis memory usage high"
      description: "Redis memory usage is {{ $value }}% of maximum."

  - alert: RedisLowHitRate
    expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.8
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Redis hit rate low"
      description: "Redis cache hit rate is {{ $value }}%."

- name: lms-infrastructure
  rules:
  # System Resources
  - alert: HighCPUUsage
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage"
      description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

  - alert: HighMemoryUsage
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage"
      description: "Memory usage is {{ $value }}% on {{ $labels.instance }}."

  - alert: DiskSpaceCritical
    expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes * 100 > 90
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Disk space critical"
      description: "Disk usage is {{ $value }}% on {{ $labels.instance }}."

  - alert: DiskSpaceWarning
    expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes * 100 > 80
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Disk space warning"
      description: "Disk usage is {{ $value }}% on {{ $labels.instance }}."

- name: lms-security
  rules:
  # Security Alerts
  - alert: HighFailedLogins
    expr: rate(auth_failed_logins_total[5m]) > 10
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High failed login attempts"
      description: "Failed login rate is {{ $value }} per second."

  - alert: SuspiciousActivity
    expr: rate(http_requests_total{status="403"}[5m]) > 5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Suspicious activity detected"
      description: "High rate of 403 responses: {{ $value }} per second."

  - alert: SSLCertificateExpiring
    expr: (ssl_cert_not_after - time()) / 86400 < 30
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: "SSL certificate expiring soon"
      description: "SSL certificate expires in {{ $value }} days."

- name: lms-business
  rules:
  # Business Metrics
  - alert: LowUserActivity
    expr: rate(user_sessions_total[1h]) < 0.1
    for: 30m
    labels:
      severity: info
    annotations:
      summary: "Low user activity"
      description: "User activity is unusually low: {{ $value }} sessions per second."

  - alert: HighCourseEnrollments
    expr: rate(course_enrollments_total[1h]) > 100
    for: 5m
    labels:
      severity: info
    annotations:
      summary: "High course enrollment rate"
      description: "Course enrollment rate is {{ $value }} per hour."

  - alert: QuizCompletionRateLow
    expr: rate(quiz_completions_total[1h]) / rate(quiz_starts_total[1h]) < 0.5
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: "Low quiz completion rate"
      description: "Quiz completion rate is {{ $value }}%."
