version: '3.8'
services:
  postgres-pgvector:
    image: ankane/pgvector:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_assistant
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data:
