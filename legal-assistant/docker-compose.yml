version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: legal-assistant-db
    environment:
      POSTGRES_USER: ${DB_USER:-legaladmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
      POSTGRES_DB: ${DB_NAME:-legal_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-legaladmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-assistant-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-assistant-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-legaladmin}:${DB_PASSWORD:-securepassword}@postgres:5432/${DB_NAME:-legal_assistant}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legal-assistant-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  legal-assistant-network:
    driver: bridge
